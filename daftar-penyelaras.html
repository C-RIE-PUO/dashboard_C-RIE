<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran & Pengurusan Pengguna</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col relative">

    <header class="bg-indigo-800 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-6 flex flex-col md:flex-row justify-between items-center">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold tracking-wide">👨‍🏫 Pengurusan Pengguna</h1>
                <p class="text-indigo-200 mt-1 text-sm">Pendaftaran, Pengesahan & Kemaskini Profil</p>
            </div>
            <div class="mt-4 md:mt-0 flex gap-3">
                <a href="paparan.html" class="bg-white text-indigo-800 px-5 py-2.5 rounded-full font-bold shadow hover:bg-indigo-50 transition flex items-center gap-2 text-sm">
                    &larr; Laman Utama
                </a>
            </div>
        </div>
    </header>

<main class="max-w-[90rem] mx-auto px-4 py-8 flex-grow w-full grid grid-cols-1 lg:grid-cols-4 gap-8 lg:gap-12">
    
    <div class="lg:col-span-1 min-w-[360px]">
        <div class="bg-white rounded-2xl shadow-md border border-gray-200 overflow-hidden sticky top-8">
            <div class="bg-indigo-50 p-5 border-b border-gray-200">
                <h2 class="text-lg font-bold text-indigo-800 flex items-center gap-2 whitespace-nowrap">📝 Daftar Penyelaras dan Penyelia</h2>
            </div>
            <div class="p-6">
                <div id="mesejBorang" class="hidden mb-4 p-3 rounded-xl text-center text-sm font-bold border"></div>
                
                <form id="borangDaftar" onsubmit="hantarPendaftaran(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Nama Penuh</label>
                        <input type="text" id="nama" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none uppercase" placeholder="NAMA PENUH">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">No. Kad Pengenalan</label>
                        <input type="text" id="noIC" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Contoh: 801231081234">
                    </div>
                    <!-- TAMBAH: Ruangan No. HP -->
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">No. Telefon (HP)</label>
                        <input type="text" id="noHP" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Contoh: 0123456789">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Kata Laluan</label>
                        <input type="password" id="katalaluan" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Sahkan Kata Laluan</label>
                        <input type="password" id="katalaluan_sah" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Jabatan</label>
                        <select id="jabatan" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none uppercase">
                            <option value="">⏳ Memuat turun...</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Bahagian / Unit (Pilihan)</label>
                        <select id="bahagian" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none uppercase">
                            <option value="">⏳ Memuat turun...</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Peranan</label>
                        <select id="peranan" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none uppercase">
                            <option value="">⏳ Memuat turun...</option>
                        </select>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">Sesi</label>
                            <input type="text" id="sesi" readonly class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-100 text-gray-500 font-bold focus:outline-none cursor-not-allowed" value="⏳">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">Tahun</label>
                            <input type="text" id="tahun" readonly class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-100 text-gray-500 font-bold focus:outline-none cursor-not-allowed" value="⏳">
                        </div>
                    </div>
                    
                    <button type="submit" id="btnHantar" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg shadow-md transition mt-4">
                        Hantar Pendaftaran
                    </button>
                </form>
            </div>
        </div>
    </div>

    <div class="lg:col-span-3 lg:ml-4">
        <div id="mesejDashboard" class="hidden mb-4 p-4 rounded-xl text-center text-sm font-bold shadow-sm border"></div>

        <div class="bg-white rounded-2xl shadow-md border border-gray-200 overflow-hidden">
            <div class="bg-indigo-50 p-5 border-b border-gray-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <h2 class="text-lg font-bold text-indigo-800 flex items-center gap-2">📊 Senarai Penuh Pengguna Sistem</h2>
                
                <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
                    <input type="number" id="carianTahun" oninput="terapkanTapisan()" placeholder="Cari Tahun..." class="px-3 py-1.5 border border-indigo-300 rounded-lg text-sm font-bold focus:ring-indigo-500 outline-none text-gray-700 w-full md:w-auto sm:w-32">

                    <select id="filterJabatan" onchange="terapkanTapisan()" class="px-3 py-1.5 border border-indigo-300 rounded-lg text-sm font-bold focus:ring-indigo-500 outline-none text-gray-700 w-full md:w-auto">
                        <option value="">Semua Jabatan</option>
                    </select>

                    <!-- TAMBAH: Filter Bahagian -->
                    <select id="filterBahagian" onchange="terapkanTapisan()" class="px-3 py-1.5 border border-indigo-300 rounded-lg text-sm font-bold focus:ring-indigo-500 outline-none text-gray-700 w-full md:w-auto">
                        <option value="">Semua Bahagian</option>
                    </select>

                    <select id="filterPeranan" onchange="terapkanTapisan()" class="px-3 py-1.5 border border-indigo-300 rounded-lg text-sm font-bold focus:ring-indigo-500 outline-none text-gray-700 w-full md:w-auto">
                        <option value="">Semua Peranan</option>
                    </select>

                    <!-- KEMAS KINI: ID ditambah dan disetkan kepada hidden secara lalai -->
                    <button id="btnMuatTurunCSV" onclick="muatTurunCSV()" class="hidden bg-emerald-600 text-white px-4 py-1.5 rounded-lg text-sm font-bold hover:bg-emerald-700 transition shadow-sm flex-1 md:flex-none">
                        📥 CSV
                    </button>
                    
                    <button onclick="muatSenaraiPenyelaras()" class="bg-indigo-600 text-white px-4 py-1.5 rounded-lg text-sm font-bold hover:bg-indigo-700 transition shadow-sm flex-1 md:flex-none">
                        🔄 Refresh
                    </button>
                </div>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-indigo-600 text-white uppercase tracking-wide text-xs">
                            <th class="p-3 border-b text-center w-12">BIL</th>
                            <th class="p-3 border-b w-1/4">NAMA</th>
                            <!-- TAMBAH: Header No HP (Sembunyi secara lalai) -->
                            <th id="thNoHP" class="p-3 border-b text-center hidden">NO. HP</th>
                            <th class="p-3 border-b text-center">JABATAN</th>
                            <th class="p-3 border-b text-center">PERANAN</th>
                            <th class="p-3 border-b text-center">BAHAGIAN</th>
                            <th class="p-3 border-b text-center">SESI</th>
                            <th class="p-3 border-b text-center">TAHUN</th>
                            <th class="p-3 border-b text-center">STATUS</th>
                            <th id="thTindakan" class="p-3 border-b text-center hidden w-28">TINDAKAN</th>
                        </tr>
                    </thead>
                    <tbody id="isiJadual" class="text-gray-700 bg-white">
                        <tr><td colspan="10" class="p-10 text-center font-bold text-indigo-500 animate-pulse">⏳ Memuat turun senarai...</td></tr>
                    </tbody>
                </table>
            </div>

            <div id="kawalanNavigasi" class="bg-gray-50 border-t border-gray-200 p-4 flex justify-between items-center hidden">
                <button id="btnPrev" onclick="tukarMukaSurat(-1)" class="bg-indigo-200 text-indigo-800 hover:bg-indigo-300 px-4 py-2 rounded text-sm font-bold disabled:opacity-50 disabled:cursor-not-allowed transition">Terdahulu</button>
                <span id="teksMukaSurat" class="text-sm font-bold text-gray-700">Muka 1 / 1</span>
                <button id="btnNext" onclick="tukarMukaSurat(1)" class="bg-indigo-600 text-white hover:bg-indigo-700 px-4 py-2 rounded text-sm font-bold disabled:opacity-50 disabled:cursor-not-allowed transition">Seterusnya</button>
            </div>
        </div>
    </div>
</main>

    <div id="modalKemaskini" class="fixed inset-0 bg-black bg-opacity-60 z-50 hidden flex items-center justify-center backdrop-blur-sm transition-opacity p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all">
            <div class="bg-amber-500 p-4 text-white flex justify-between items-center">
                <h3 class="font-bold text-lg flex items-center gap-2">✏️ Kemaskini Profil</h3>
                <button onclick="tutupModal()" class="text-white hover:text-amber-200 text-2xl font-bold leading-none">&times;</button>
            </div>
            
            <form id="formKemaskini" onsubmit="simpanKemaskini(event)" class="p-6 space-y-4 max-h-[80vh] overflow-y-auto">
                <input type="hidden" id="editIC_Lama"> 
               
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Nama Pengguna <span class="text-red-500">*</span></label>
                    <input type="text" id="editNama" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 outline-none uppercase">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">No. Kad Pengenalan (IC) <span class="text-red-500">*</span></label>
                    <input type="text" id="editIC_Baru" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 outline-none">
                </div>
                
                <!-- TAMBAH: Edit No HP dalam modal -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">No. Telefon (HP) <span class="text-red-500">*</span></label>
                    <input type="text" id="editNoHP" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Jabatan</label>
                    <select id="editJabatan" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 outline-none uppercase bg-amber-50">
                        <option value="">⏳ Memuat turun...</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Bahagian / Unit</label>
                    <select id="editBahagian" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 outline-none uppercase bg-amber-50">
                        <option value="">⏳ Memuat turun...</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Peranan Sistem</label>
                    <select id="editPeranan" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 outline-none uppercase bg-amber-50">
                        <option value="">⏳ Memuat turun...</option>
                    </select>
                </div>
				
				<div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Status Sistem</label>
                    <select id="editStatus" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 outline-none uppercase bg-amber-50">
                        <option value="MENUNGGU PENGESAHAN">MENUNGGU PENGESAHAN</option>
                        <option value="AKTIF">AKTIF</option>
                        <option value="TIDAK AKTIF">TIDAK AKTIF</option>
                        <option value="DISAHKAN">DISAHKAN</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Sesi</label>
                    <input type="text" id="editSesi" placeholder="Contoh: 1 Atau 2" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 outline-none uppercase">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">Tahun</label>
                    <input type="number" id="editTahun" placeholder="Contoh: 2024" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 outline-none">
                </div>

                <div class="pt-5 flex justify-end gap-3 border-t mt-6">
                    <button type="button" onclick="tutupModal()" class="px-5 py-2.5 bg-gray-200 text-gray-800 rounded-lg font-bold hover:bg-gray-300 transition">Batal</button>
                    <button type="submit" id="btnSimpanKemaskini" class="px-5 py-2.5 bg-amber-500 text-white rounded-lg font-bold hover:bg-amber-600 transition shadow-md">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ⚠️ MASUKKAN URL WEB APP ANDA DI SINI
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxh9pAf8LKl5CU7HFcr5TfKZYy1O5XeFhAX9GgiojzCvB81IOfnNBOuzQoV7zntObI/exec'; 

        const userPeranan = (sessionStorage.getItem("peranan") || "").toUpperCase();
        const userJabatan = (sessionStorage.getItem("jabatan") || "").toUpperCase(); // TAMBAH: Dapatkan jabatan pengguna login
        const rawIC = sessionStorage.getItem("ic") || sessionStorage.getItem("noIC") || sessionStorage.getItem("NO_IC") || sessionStorage.getItem("no_ic") || ""; 
        const userICSemasa = String(rawIC).trim();
        
        // 1. Kumpulkan semua peranan Penyelaras yang setara ke dalam satu tatasusunan (array)
        const senaraiPenyelaras = [
            "PENYELARAS INOVASI", 
            "PENYELARAS PENYELIDIKAN",
            "PENYELARAS INOVASI (C-RIE)",
            "PENYELARAS PENYELIDIKAN (C-RIE)"
        ];
        // 2. Tentukan jika pengguna log masuk adalah Approver
        // (Gabungkan ADMIN, KUPIK, dan senaraiPenyelaras menggunakan sintaks penyebaran '...')
        const isApprover = ["ADMIN", "KUPIK", ...senaraiPenyelaras].includes(userPeranan);

        // 3. KAWALAN: Senarai peranan yang dibenarkan muat turun CSV
        const allowedCSVRoles = [
            "ADMIN", 
            "KUPIK", 
            ...senaraiPenyelaras
        ];

        let dataPenggunaGlobal = []; 
        let dataDitapis = []; 
        let mukaSuratSemasa = 1;
        const rekodPerMukaSurat = 10;
        
        // Simpan nilai global supaya tidak hilang bila form reset
        let sesiSistem = ""; 
        let tahunSistem = "";

        // ==========================================
        // DIPERBAIKI: SATUKAN window.onload & KAWALAN AKSES
        // ==========================================
        window.onload = () => {
            const thTindakan = document.getElementById('thTindakan');
            const thNoHP = document.getElementById('thNoHP');

            // KAWALAN: Jika tiada pengguna login, sembunyikan TINDAKAN
            if (!userPeranan) {
                if(thTindakan) thTindakan.classList.add('hidden');
                if(thNoHP) thNoHP.classList.add('hidden');
            } 
            // KAWALAN: Jika pengguna login adalah Approver
            else if (isApprover) { 
                if(thTindakan) thTindakan.classList.remove('hidden'); 
                if(thNoHP) thNoHP.classList.remove('hidden'); // Papar NO HP untuk Approver
            } 
            // KAWALAN: Pengguna biasa (STAF, PENYELARAS JABATAN, PENYELIA PROJEK PELAJAR)
            else {
                if(thTindakan) thTindakan.classList.remove('hidden'); 
            }
            
            // Semak adakah peranan dibenarkan melihat butang CSV
            if (allowedCSVRoles.includes(userPeranan)) {
                const btnCSV = document.getElementById('btnMuatTurunCSV');
                if (btnCSV) btnCSV.classList.remove('hidden');
            }
            
            // Panggil fungsi untuk muat sesi dan tahun dari pangkalan data
            muatSesiDanTahunGlobal();
            muatTetapanDropdown(); 
            muatSenaraiPenyelaras();
        };

        function muatTetapanDropdown() {
            fetch(`${SCRIPT_URL}?action=ambilTetapanSenarai`)
            .then(res => res.json())
            .then(data => {
                if (data.status === "BERJAYA") {
                    // --- SETUP JABATAN ---
                    let htmlJabatan = '<option value="">-- Pilih Jabatan --</option>';
                    data.JABATAN.forEach(j => htmlJabatan += `<option value="${j}">${j}</option>`);
                    document.getElementById('jabatan').innerHTML = htmlJabatan;
                    document.getElementById('editJabatan').innerHTML = htmlJabatan;
                    
                    let htmlFilterJab = '<option value="">Semua Jabatan</option>';
                    data.JABATAN.forEach(j => htmlFilterJab += `<option value="${j}">${j}</option>`);
                    document.getElementById('filterJabatan').innerHTML = htmlFilterJab;

                    // --- SETUP BAHAGIAN ---
                    let htmlBahagian = '<option value="">-- Pilih Bahagian (Pilihan) --</option>';
                    data.BAHAGIAN.forEach(b => htmlBahagian += `<option value="${b}">${b}</option>`);
                    document.getElementById('bahagian').innerHTML = htmlBahagian;
                    document.getElementById('editBahagian').innerHTML = htmlBahagian;

                    // TAMBAH: SETUP FILTER BAHAGIAN
                    let htmlFilterBahagian = '<option value="">Semua Bahagian</option>';
                    data.BAHAGIAN.forEach(b => htmlFilterBahagian += `<option value="${b}">${b}</option>`);
                    document.getElementById('filterBahagian').innerHTML = htmlFilterBahagian;

                    // --- SETUP PERANAN ---
                    let htmlPeranan = '<option value="">-- Pilih Peranan --</option>';
                    data.PERANAN.forEach(p => {
                        // Semak dan abaikan jika peranan adalah STAF
                        if (p.toString().trim().toUpperCase() !== "STAF") {
                            htmlPeranan += `<option value="${p}">${p}</option>`;
                        }
                    });
                    document.getElementById('peranan').innerHTML = htmlPeranan; // Untuk Daftar
                    document.getElementById('editPeranan').innerHTML = htmlPeranan; // Untuk Edit

                    // FILTER PERANAN 
                    let htmlFilterPeranan = '<option value="">Semua Peranan</option>';
                    data.PERANAN.forEach(p => {
                        if (p.toString().trim().toUpperCase() !== "STAF") {
                            htmlFilterPeranan += `<option value="${p}">${p}</option>`;
                        }
                    });
                    document.getElementById('filterPeranan').innerHTML = htmlFilterPeranan;
                }
            })
            .catch(err => console.log("Gagal memuat turun tetapan dropdown."));
        }

        // FUNGSI BAHARU: Ambil Sesi dan Tahun
        function muatSesiDanTahunGlobal() {
            fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: "ambilSesiGlobal" })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "BERJAYA") {
                    sesiSistem = data.sesi;
                    tahunSistem = data.tahun;
                    document.getElementById('sesi').value = sesiSistem;
                    document.getElementById('tahun').value = tahunSistem;
                } else {
                    document.getElementById('sesi').value = "RALAT";
                    document.getElementById('tahun').value = "RALAT";
                    console.error("Gagal dapatkan sesi:", data.mesej);
                }
            })
            .catch(err => {
                document.getElementById('sesi').value = "RALAT";
                document.getElementById('tahun').value = "RALAT";
                console.error("Ralat Rangkaian (Sesi):", err);
            });
        }

        function hantarPendaftaran(e) {
            e.preventDefault();
            
            const pass1 = document.getElementById('katalaluan').value;
            const pass2 = document.getElementById('katalaluan_sah').value;
            if (pass1 !== pass2) {
                alert("❌ Kata laluan tidak sepadan! Sila pastikan pengesahan kata laluan adalah tepat.");
                document.getElementById('katalaluan_sah').focus();
                return;
            }

            const btn = document.getElementById('btnHantar');
            const mesej = document.getElementById('mesejBorang');
            btn.disabled = true; btn.innerHTML = '⏳ Menghantar...'; mesej.classList.add('hidden');

            const payload = {
                action: "tambahPengguna",
                NAMA: document.getElementById('nama').value.toUpperCase(),
                NO_IC: document.getElementById('noIC').value, 
                NO_HP: document.getElementById('noHP').value, // TAMBAH: No HP ke payload
                KATA_LALUAN: pass1,
                JABATAN: document.getElementById('jabatan').value.toUpperCase(),
                BAHAGIAN: document.getElementById('bahagian').value.toUpperCase(), 
                PERANAN: document.getElementById('peranan').value.toUpperCase(),
                SESI: document.getElementById('sesi').value,
                TAHUN: document.getElementById('tahun').value,
                STATUS: "MENUNGGU PENGESAHAN" 
            };

            fetch(SCRIPT_URL, { 
                method: 'POST', 
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload) 
            })
            .then(res => res.json()).then(data => {
                if (data.status === "BERJAYA") {
                    const isDuplicate = data.mesej.includes("sedia ada");

                    if (isDuplicate) {
                        mesej.className = 'mb-4 p-3 rounded-xl text-center text-sm font-bold bg-yellow-100 text-yellow-800 border border-yellow-200';
                        mesej.innerHTML = `ℹ️ <strong>MAKLUMAN:</strong> <br> ${data.mesej}`;
                    } else {
                        mesej.className = 'mb-4 p-3 rounded-xl text-center text-sm font-bold bg-green-100 text-green-800 border border-green-200';
                        mesej.innerText = "✅ " + data.mesej;
                    }

                    document.getElementById('borangDaftar').reset();
                    document.getElementById('sesi').value = sesiSistem;
                    document.getElementById('tahun').value = tahunSistem;
                    
                    muatSenaraiPenyelaras(); 

                } else {
                    mesej.className = 'mb-4 p-3 rounded-xl text-center text-sm font-bold bg-red-100 text-red-800 border border-red-200';
                    mesej.innerText = "❌ Ralat: " + data.mesej;
                }
        
                mesej.classList.remove('hidden');
            }).catch(err => {
                mesej.className = 'mb-4 p-3 rounded-xl text-center text-sm font-bold bg-red-100 text-red-800 border-red-200';
                mesej.innerText = "⚠️ Gagal menghubungi pangkalan data.";
                mesej.classList.remove('hidden');
            }).finally(() => { btn.disabled = false; btn.innerHTML = 'Hantar Pendaftaran'; });
        }

        function muatSenaraiPenyelaras() {
            const tbody = document.getElementById('isiJadual');
            tbody.innerHTML = `<tr><td colspan="10" class="p-10 text-center font-bold text-indigo-500 animate-pulse">⏳ Memuat turun...</td></tr>`;

            fetch(`${SCRIPT_URL}?action=ambilPengguna`)
            .then(res => res.json()).then(result => {
                if (result.status === "BERJAYA") { 
                    // Reverse awal supaya yang terbaru duduk di atas
                    dataPenggunaGlobal = (result.data || []).reverse(); 
                    terapkanTapisan(); 
                } 
                else { tbody.innerHTML = `<tr><td colspan="10" class="p-6 text-center text-red-600 font-bold">❌ Mesej: ${result.mesej}</td></tr>`; }
            }).catch(err => { tbody.innerHTML = `<tr><td colspan="10" class="p-6 text-center text-red-600 font-bold">⚠️ Ralat menyambung ke pangkalan data.</td></tr>`; });
        }

        // ==========================================
        // KEMASKINI: FUNGSI TERAPKAN TAPISAN
        // ==========================================
        function terapkanTapisan() {
            const valJab = document.getElementById('filterJabatan').value;
            const valBahagian = document.getElementById('filterBahagian').value; // TAMBAH: Ambil nilai Bahagian
            const valPeranan = document.getElementById('filterPeranan').value;
            const valTahun = document.getElementById('carianTahun').value.trim();

            // Tapis dataGlobal berdasarkan 4 kriteria
            dataDitapis = dataPenggunaGlobal.filter(row => {
                let padanJabatan = (valJab === "") || (row.jabatan === valJab);
                let padanBahagian = (valBahagian === "") || (row.bahagian === valBahagian); // TAMBAH: Tapisan Bahagian
                let padanPeranan = (valPeranan === "") || (String(row.peranan).toUpperCase() === String(valPeranan).toUpperCase());
                let padanTahun = (valTahun === "") || (String(row.tahun).includes(valTahun));

                return padanJabatan && padanBahagian && padanPeranan && padanTahun;
            });
            
            // Reset kembali ke muka surat 1 setiap kali tapisan ditukar
            mukaSuratSemasa = 1;
            paparJadualPaginasi();
        }

        // FUNGSI TUKAR MUKA SURAT
        function tukarMukaSurat(arah) {
            mukaSuratSemasa += arah;
            paparJadualPaginasi();
        }

        function paparJadualPaginasi() {
            const tbody = document.getElementById('isiJadual');
            const navBar = document.getElementById('kawalanNavigasi');
            tbody.innerHTML = "";

            if (dataDitapis.length === 0) {
                tbody.innerHTML = `<tr><td colspan="10" class="p-10 text-center text-gray-500 font-medium">Tiada pengguna dijumpai.</td></tr>`;
                navBar.classList.add('hidden');
                return;
            }

            // 🌟 PENAMBAHBAIKAN BARU: Susun (Sort) dataDitapis mengikut TAHUN (Terkini) dan SESI (Terkini)
            dataDitapis.sort((a, b) => {
                const tahunA = parseInt(a.tahun) || 0;
                const tahunB = parseInt(b.tahun) || 0;
                const sesiA = parseInt(a.sesi) || 0;
                const sesiB = parseInt(b.sesi) || 0;

                if (tahunB !== tahunA) return tahunB - tahunA; 
                else return sesiB - sesiA;   
            });

            const jumlahMukaSurat = Math.ceil(dataDitapis.length / rekodPerMukaSurat);
            const indexMula = (mukaSuratSemasa - 1) * rekodPerMukaSurat;
            const indexTamat = indexMula + rekodPerMukaSurat;
            const rekodSemasa = dataDitapis.slice(indexMula, indexTamat);

            const fragment = document.createDocumentFragment();

            rekodSemasa.forEach((row, index) => {
                const statusCaps = (row.status || "MENUNGGU").toUpperCase();
                let badgeStatus = `<span class="bg-orange-100 text-orange-800 border border-orange-300 px-2 py-1 rounded text-[11px] font-bold whitespace-nowrap">⏳ ${statusCaps}</span>`;
                
                if (["SAH", "DISAHKAN", "AKTIF"].includes(statusCaps)) {
                    badgeStatus = `<span class="bg-green-100 text-green-800 border border-green-300 px-2 py-1 rounded text-[11px] font-bold whitespace-nowrap">✅ AKTIF</span>`;
                }

                let strBahagian = row.bahagian || "-";
                let strSesi = row.sesi || "-";
                let strTahun = row.tahun || "-";
                let strNoHp = row.no_hp || "-"; 

                let safeBahagian = strBahagian.replace(/'/g, "\\'");
                let safeNama = (row.nama || "").replace(/'/g, "\\'");
                let safeSesi = String(strSesi).replace(/'/g, "\\'");
                let safeTahun = String(strTahun).replace(/'/g, "\\'");
                let safeNoHp = String(strNoHp).replace(/'/g, "\\'"); 
                let barisIC = String(row.ic).trim(); 
                
                let roleBaris = String(row.peranan || "").toUpperCase().trim();
                let isSelf = (userICSemasa !== "" && barisIC === userICSemasa);
                
                // TAMBAHAN: Semak jika dalam jabatan yang sama (untuk Penyelaras Jabatan/Penyelia)
                let rowJabatan = String(row.jabatan || "").toUpperCase();
                let isSameJabatan = (userJabatan !== "" && rowJabatan === userJabatan);

                let btnTindakan = `<span class="text-gray-300">-</span>`;
                
                // FUNGSI EDIT DENGAN PENGESAHAN NO IC
                let btnEdit = `<button onclick="sahkanDanBukaModal('${barisIC}', '${safeNama}', '${row.jabatan}', '${safeBahagian}', '${row.peranan}', '${statusCaps}', '${safeSesi}', '${safeTahun}', '${safeNoHp}')" class="bg-amber-500 hover:bg-amber-600 text-white px-2 py-1 rounded font-bold shadow-sm transition text-xs w-full flex items-center justify-center gap-1 mb-1">✏️ Edit</button>`;

                // KAWALAN PAPARAN BUTANG TINDAKAN
                if (!userPeranan) {
                    // Jika tiada peranan (belum log masuk / role kosong), tiada butang akan dipapar
                    btnTindakan = `<span class="text-gray-300">-</span>`;
                } else if (isApprover) {
                    // Role Approver (Admin, Kupik, Inovasi, Penyelidikan)
                    let btnSahkan = "";
                    if (!["SAH", "AKTIF", "DISAHKAN"].includes(statusCaps)) {
                        btnSahkan = `<button onclick="sahkanPengguna('${barisIC}', '${safeNama}')" class="bg-blue-600 hover:bg-blue-700 text-white px-2 py-1 rounded font-bold shadow-sm transition text-xs w-full mb-1">Sahkan</button>`;
                    }
                    
                    let isAdminRole = (roleBaris === "ADMIN");
                    let perananLogin = userPeranan;
                    let isSekatKupik = (perananLogin === "KUPIK") && senaraiPenyelaras.includes(roleBaris);

                    let btnPadam = "";
                    if (isSelf || isAdminRole || isSekatKupik) {
                        let tajukKunci = "Tindakan disekat";
                        if (isSelf) tajukKunci = "Anda tidak boleh memadam akaun sendiri";
                        else if (isAdminRole) tajukKunci = "Akaun ADMIN tidak boleh dipadam";
                        else if (isSekatKupik) tajukKunci = "KUPIK tidak mempunyai kuasa memadam rekod ini";
                        
                        btnPadam = `<button disabled class="bg-gray-200 text-gray-400 px-2 py-1 rounded font-bold shadow-sm text-xs w-full flex items-center justify-center gap-1 cursor-not-allowed" title="${tajukKunci}">🗑️ Padam</button>`;
                    } else {
                        btnPadam = `<button onclick="padamPengguna('${barisIC}', '${safeNama}')" class="bg-red-500 hover:bg-red-600 text-white px-2 py-1 rounded font-bold shadow-sm transition text-xs w-full flex items-center justify-center gap-1">🗑️ Padam</button>`;
                    }
                    
                    btnTindakan = `<div class="flex flex-col gap-1 w-full">${btnSahkan}${btnEdit}${btnPadam}</div>`;
                } else if (isSameJabatan || isSelf) {
                    // Role seperti PENYELARAS JABATAN / PENYELIA PROJEK PELAJAR
                    // Hanya memaparkan butang Edit jika mereka dalam JABATAN yang sama ATAU diri sendiri
                    btnTindakan = `<div class="flex flex-col gap-1 w-full">${btnEdit}</div>`;
                }

                // Kawalan Paparan No. HP 
                let tdNoHP = isApprover ? `<td class="p-3 text-center font-bold text-gray-600 text-xs">${strNoHp}</td>` : ``;

                const tr = document.createElement('tr');
                tr.className = "border-b hover:bg-indigo-50 transition";
                
                let tdContent = `
                    <td class="p-3 text-center font-bold text-gray-600">${indexMula + index + 1}</td>
                    <td class="p-3 font-bold text-gray-800 text-xs uppercase">${row.nama || "-"}</td>
                    ${tdNoHP}
                    <td class="p-3 text-center font-bold text-indigo-700 text-xs uppercase">${row.jabatan || "-"}</td>
                    <td class="p-3 text-center font-semibold text-gray-600 text-[11px] uppercase">${row.peranan || "-"}</td>
                    <td class="p-3 text-center font-semibold text-gray-500 text-[11px] uppercase">${strBahagian}</td>
                    <td class="p-3 text-center font-semibold text-gray-600 text-xs">${strSesi}</td>
                    <td class="p-3 text-center font-semibold text-gray-600 text-xs">${strTahun}</td>
                    <td class="p-3 text-center">${badgeStatus}</td>
                    <td class="p-3 text-center">${btnTindakan}</td>
                `;

                tr.innerHTML = tdContent; 
                fragment.appendChild(tr);
            });

            tbody.appendChild(fragment);

            if (jumlahMukaSurat > 1) {
                navBar.classList.remove('hidden');
                document.getElementById('teksMukaSurat').innerText = `Muka ${mukaSuratSemasa} / ${jumlahMukaSurat}`;
                document.getElementById('btnPrev').disabled = (mukaSuratSemasa === 1);
                document.getElementById('btnNext').disabled = (mukaSuratSemasa === jumlahMukaSurat);
            } else {
                navBar.classList.add('hidden');
            }
        }

        // ==========================================
        // FUNGSI KESELAMATAN SEBELUM BUKA MODAL
        // ==========================================
        function sahkanDanBukaModal(ic, nama, jabatan, bahagian, peranan, status, sesi, tahun, noHp) {
            // Jika bukan approver, perlukan No IC sebagai pengesahan
            if (!isApprover) {
                const kataLaluan = prompt("🔒 Keselamatan: Sila masukkan NO. IC anda sebagai pengesahan identiti:", "");
                if (kataLaluan !== ic) {
                    alert("❌ Pengesahan gagal! NO IC tidak tepat.");
                    return;
                }
            }
            bukaModalKemaskini(ic, nama, jabatan, bahagian, peranan, status, sesi, tahun, noHp);
        }


        // ==========================================
        // DIPERBAIKI: BUKA MODAL (Dengan Kawalan Akses Disable Input)
        // ==========================================
        function bukaModalKemaskini(ic, nama, jabatan, bahagian, peranan, status, sesi, tahun, noHp) {
            document.getElementById('editIC_Lama').value = ic;
            document.getElementById('editIC_Baru').value = ic;
            document.getElementById('editNama').value = nama;
            
            // Edit no hp dipaparkan ke dalam modal kemas kini
            document.getElementById('editNoHP').value = (noHp === "-" || !noHp) ? "" : noHp; 

            document.getElementById('editJabatan').value = jabatan;
            document.getElementById('editBahagian').value = (bahagian === "-" || !bahagian) ? "" : bahagian; 
            document.getElementById('editPeranan').value = peranan;
            
            // SET DATA STATUS, SESI & TAHUN KE DALAM MODAL
            document.getElementById('editStatus').value = status ? status.toUpperCase() : "MENUNGGU PENGESAHAN";
            document.getElementById('editSesi').value = (sesi === "-" || !sesi) ? "" : sesi;
            document.getElementById('editTahun').value = (tahun === "-" || !tahun) ? "" : tahun;
            
            // 🌟 KAWALAN AKSES: Lumpuhkan Status, Sesi, dan Tahun untuk pengguna selain Approver
            if (!isApprover) {
                document.getElementById('editStatus').disabled = true;
                document.getElementById('editStatus').classList.add('bg-gray-200', 'cursor-not-allowed');
                
                document.getElementById('editSesi').disabled = true;
                document.getElementById('editSesi').classList.add('bg-gray-200', 'cursor-not-allowed');
                
                document.getElementById('editTahun').disabled = true;
                document.getElementById('editTahun').classList.add('bg-gray-200', 'cursor-not-allowed');
            } else {
                document.getElementById('editStatus').disabled = false;
                document.getElementById('editStatus').classList.remove('bg-gray-200', 'cursor-not-allowed');
                
                document.getElementById('editSesi').disabled = false;
                document.getElementById('editSesi').classList.remove('bg-gray-200', 'cursor-not-allowed');
                
                document.getElementById('editTahun').disabled = false;
                document.getElementById('editTahun').classList.remove('bg-gray-200', 'cursor-not-allowed');
            }

            document.getElementById('modalKemaskini').classList.remove('hidden');
        }

        function tutupModal() { 
            document.getElementById('modalKemaskini').classList.add('hidden'); 
        }

        // ==========================================
        // DIPERBAIKI: SIMPAN MODAL
        // ==========================================
        function simpanKemaskini(e) {
            e.preventDefault();
            
            const btn = document.getElementById('btnSimpanKemaskini');
            btn.disabled = true; 
            btn.innerText = "⏳ Menyimpan...";

            const payload = {
                action: "kemaskiniPenggunaAdmin",
                NO_IC: document.getElementById('editIC_Lama').value,
                NO_IC_BARU: document.getElementById('editIC_Baru').value.trim(), 
                NAMA: document.getElementById('editNama').value.trim().toUpperCase(), 
                NO_HP: document.getElementById('editNoHP').value.trim(),      
                JABATAN: document.getElementById('editJabatan').value, 
                PERANAN: document.getElementById('editPeranan').value, 
                BAHAGIAN: document.getElementById('editBahagian').value, 
                
                // 🌟 Pastikan jika input disabled (pengguna biasa), ia menghantar rentetan kosong ("")
                STATUS: document.getElementById('editStatus').disabled ? "" : document.getElementById('editStatus').value,          
                SESI: document.getElementById('editSesi').disabled ? "" : document.getElementById('editSesi').value.trim(),       
                TAHUN: document.getElementById('editTahun').disabled ? "" : document.getElementById('editTahun').value.trim()      
            };

            fetch(SCRIPT_URL, { 
                method: 'POST', 
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }, 
                body: JSON.stringify(payload) 
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === "BERJAYA") {
                    alert("✅ Maklumat Profil berjaya dikemaskini!");
                    tutupModal(); 
                    muatSenaraiPenyelaras(); 
                } else { 
                    alert("❌ Ralat: " + data.mesej); 
                }
            })
            .catch(err => { 
                console.error("Ralat Fetch:", err);
                alert("⚠️ Gagal menghubungi server. Sila semak sambungan internet anda."); 
            })
            .finally(() => { 
                btn.disabled = false; 
                btn.innerText = "Simpan"; 
            });
        }

        // MUAT TURUN CSV (Diubah suai untuk include SESI, TAHUN, NO_HP dan Format Anti-Pecah)
        function muatTurunCSV() {
            if (dataDitapis.length === 0) return alert("Tiada data untuk dimuat turun.");

            // PENAMBAHBAIKAN: \uFEFF ialah BOM UTF-8 supaya Excel dapat baca aksara khas dengan betul
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; 
            csvContent += "BIL,NAMA,NO_HP,NO_IC,JABATAN,PERANAN,BAHAGIAN,SESI,TAHUN,STATUS\r\n";
            
            // PENAMBAHBAIKAN: Fungsi format teks untuk memastikan struktur koma dalam CSV tidak rosak
            const formatCSV = (text) => {
                let str = String(text || "");
                str = str.replace(/"/g, '""'); // Ganti 1 quote dengan 2 quote (Standard format CSV)
                return `"${str}"`;
            };

            dataDitapis.forEach((row, index) => {
                let bil = index + 1;
                let nama = formatCSV(row.nama);
                let noHp = formatCSV(row.no_hp); // TAMBAH: No HP diproses
                let ic = `="${row.ic || ""}"`; 
                let jab = formatCSV(row.jabatan);
                let per = formatCSV(row.peranan);
                let bah = formatCSV(row.bahagian);
                let sesi = formatCSV(row.sesi);
                let tahun = formatCSV(row.tahun);
                let stat = formatCSV(row.status);
                
                csvContent += `${bil},${nama},${noHp},${ic},${jab},${per},${bah},${sesi},${tahun},${stat}\r\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "Data_Pengguna_Sistem.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // SAHKAN PENGGUNA
        function sahkanPengguna(noIC, nama) {
            if(!confirm(`Adakah anda pasti mahu SAHKAN pengguna ini?\n\nNama: ${nama}`)) return;
            
            const msgBox = document.getElementById('mesejDashboard');
            // Ambil peranan login semasa untuk dihantar ke server
            const roleLoginSemasa = sessionStorage.getItem("peranan") || ""; 

            msgBox.className = 'mb-4 p-4 rounded-xl text-center text-sm font-bold shadow-sm border bg-blue-100 text-blue-800 border-blue-200';
            msgBox.innerText = '⏳ Sedang memproses pengesahan...'; 
            msgBox.classList.remove('hidden');

            fetch(SCRIPT_URL, { 
                method: 'POST', 
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ 
                    action: "sahkanPengguna", 
                    NO_IC: noIC,
                    LOGIN_ROLE: roleLoginSemasa 
                }) 
            })
            .then(res => res.json()).then(data => {
                if(data.status === "BERJAYA") {
                    msgBox.className = 'mb-4 p-4 rounded-xl text-center text-sm font-bold shadow-sm border bg-green-100 text-green-800 border-green-200';
                    msgBox.innerText = "✅ " + data.mesej; 
                    muatSenaraiPenyelaras();
                } else {
                    msgBox.className = 'mb-4 p-4 rounded-xl text-center text-sm font-bold shadow-sm border bg-red-100 text-red-800 border-red-200';
                    msgBox.innerText = "❌ Ralat: " + data.mesej;
                }
                setTimeout(() => msgBox.classList.add('hidden'), 5000);
            }).catch(err => {
                msgBox.className = 'mb-4 p-4 rounded-xl text-center text-sm font-bold shadow-sm border bg-red-100 text-red-800 border-red-200';
                msgBox.innerText = "⚠️ Gagal menghubungi server."; 
                msgBox.classList.remove('hidden');
            });
        }

        // PADAM PENGGUNA
        function padamPengguna(ic, nama) {
            if(!confirm(`⚠️ Adakah anda pasti mahu memadam pengguna ini secara kekal?\n\nNama: ${nama}`)) return;
            
            const msgBox = document.getElementById('mesejDashboard');
            msgBox.className = 'mb-4 p-4 rounded-xl text-center text-sm font-bold shadow-sm border bg-blue-100 text-blue-800 border-blue-200';
            msgBox.innerText = '⏳ Sedang memadam pengguna...'; msgBox.classList.remove('hidden');

            fetch(SCRIPT_URL, { 
                method: 'POST', 
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: "padamPenggunaAdmin", NO_IC: ic }) 
            })
            .then(res => res.json()).then(data => {
                if(data.status === "BERJAYA") {
                    msgBox.className = 'mb-4 p-4 rounded-xl text-center text-sm font-bold shadow-sm border bg-green-100 text-green-800 border-green-200';
                    msgBox.innerText = "✅ " + data.mesej; 
                    muatSenaraiPenyelaras();
                } else {
                    msgBox.className = 'mb-4 p-4 rounded-xl text-center text-sm font-bold shadow-sm border bg-red-100 text-red-800 border-red-200';
                    msgBox.innerText = "❌ Ralat: " + data.mesej;
                }
                setTimeout(() => msgBox.classList.add('hidden'), 5000);
            }).catch(err => {
                msgBox.className = 'mb-4 p-4 rounded-xl text-center text-sm font-bold shadow-sm border bg-red-100 text-red-800 border-red-200';
                msgBox.innerText = "⚠️ Gagal menghubungi server."; msgBox.classList.remove('hidden');
            });
        }
    </script>
