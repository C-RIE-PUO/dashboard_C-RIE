<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dokumen KPI Inovasi</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col relative">

    <header class="bg-indigo-800 text-white shadow-md">
        <div class="max-w-5xl mx-auto px-4 py-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold tracking-wide flex items-center flex-wrap gap-3">
                    📂 Pengurusan Dokumen
                    <span id="paparanTahunSemasa" class="hidden text-sm bg-indigo-600 border border-indigo-400 text-indigo-50 px-3 py-1 rounded-full shadow-sm">
                        ⏳ Memuatkan tahun...
                    </span>
                </h1>
                <p class="text-indigo-200 mt-1 text-sm">Muat Naik, Muat Turun & Kemaskini Dokumen KPI Inovasi</p>
            </div>
            
            <div class="flex flex-wrap justify-center gap-3">
                <a href="Senarai Semak KPI-Inovasi.html" class="bg-slate-600 text-white px-5 py-2 rounded-full font-bold shadow hover:bg-slate-700 transition flex items-center gap-2 text-sm border border-slate-500">
                    ⬅️ Kembali
                </a>
                
                <a href="utama.html" class="bg-white text-indigo-800 px-5 py-2 rounded-full font-bold shadow hover:bg-indigo-50 transition flex items-center gap-2 text-sm border border-indigo-200">
                    🏠 Utama
                </a>
                <a href="dashboard-kpi.html" class="bg-indigo-600 text-white px-5 py-2 rounded-full font-bold shadow hover:bg-indigo-700 transition flex items-center gap-2 text-sm border border-indigo-400">
                    📊 Dashboard KPI
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8 flex-grow w-full">
        
        <div id="mesejUI" class="hidden mb-6 p-4 rounded-xl text-center text-sm font-bold shadow-sm border"></div>

        <div class="bg-white rounded-2xl shadow-md border border-gray-200 overflow-hidden">
            <div class="bg-indigo-50 p-5 border-b border-gray-200 flex justify-between items-center">
                <h2 class="text-lg font-bold text-indigo-800 flex items-center gap-2">📄 Senarai Dokumen Inovasi</h2>
            </div>
            
            <div class="p-6 space-y-6" id="senaraiDokumen">
                </div>
        </div>

    </main>

    <div id="modalTahun" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 items-center justify-center px-4 transition-opacity">
        <div class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6 transform transition-all">
            <h3 class="text-lg font-bold text-gray-900 mb-2">Maklumat Tahun</h3>
            <p class="text-sm text-gray-500 mb-4">Sila masukkan tahun untuk KAMUS KPI sebelum fail disimpan ke Google Drive.</p>
            
            <input type="number" id="inputTahun" class="w-full border border-gray-300 rounded-lg px-4 py-2 mb-6 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none" placeholder="Contoh: 2024" min="2000" max="2100">
            
            <div class="flex justify-end gap-3">
                <button onclick="tutupModalTahun()" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg text-sm font-bold hover:bg-gray-200 transition">Batal</button>
                <button onclick="sahkanMuatNaikKamus()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-bold hover:bg-indigo-700 transition shadow-sm">Simpan ke Drive</button>
            </div>
        </div>
    </div>

<script>
// URL GOOGLE APPS SCRIPT
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxh9pAf8LKl5CU7HFcr5TfKZYy1O5XeFhAX9GgiojzCvB81IOfnNBOuzQoV7zntObI/exec';

// TETAPAN GOOGLE DRIVE FOLDER ID
const FOLDER_ID_KAMUS = "1NYqDHUyaz1HTnbJh4_6kh1Axgu60WaoC"; 
const FOLDER_ID_DOKUMEN = "1zYRQF7Ftd-9LYz_NWso93N0h66lXeZSA"; 
const FOLDER_ID_SIJIL = "1wHiKrx1PQH47OxeZfJLqdAaN96m6CZr"; 

let failSementara = null;
let idDokumenSementara = null;

// ==========================================
// 1. SEMAKAN PERANAN & KAWALAN AKSES
// ==========================================
const userPeranan = sessionStorage.getItem("peranan") || "";
const perananLayakUpload = ["PENYELARAS INOVASI", "PENYELARAS PENYELIDIKAN", "ADMIN", "KUPIK"];
const layakUpload = perananLayakUpload.some(p => userPeranan.toUpperCase().includes(p));

// ==========================================
// 2. SENARAI DOKUMEN (DINAMIK)
// ==========================================
const senaraiDokumen = [
    { id: "doc1", tajuk: "GARIS PANDUAN PENYEDIAAN LAPORAN INOVASI PRODUK", failDitemui: [], hasTemplate: false },
    { id: "doc2", tajuk: "SURAT APLIKASI PRODUK_AGENSI KERAJAAN", failDitemui: [], hasTemplate: true },
    { id: "doc3", tajuk: "SURAT APLIKASI PRODUK_AGENSI SWASTA", failDitemui: [], hasTemplate: true },
    { id: "doc4", tajuk: "LAPORAN INOVASI", failDitemui: [], hasTemplate: true },
    { id: "doc5", tajuk: "KAMUS KPI", failDitemui: [], tahun: null, hasTemplate: false },
    { id: "doc6", tajuk: "BORANG PENDAFTARAN HARTA INTELEK CR-1", failDitemui: [], hasTemplate: false },
    { id: "doc7", tajuk: "BORANG SEMAKAN KPI", failDitemui: [], hasTemplate: true, templateKunci: "SENARAI SEMAK KPI 18_ RDICE" }
];

// 🌟 LOGIK KAWALAN: Hanya masukkan doc8 jika pengguna layak
if (layakUpload) {
    senaraiDokumen.push({ 
        id: "doc8", 
        tajuk: "TEMPLATE SIJIL PENGHARGAAN KPI", 
        failDitemui: [], 
        hasTemplate: false, 
        folderIdKhas: FOLDER_ID_SIJIL, 
        isSijil: true,
        // 🌟 PENETAPAN NAMA KHAS: Backend (GAS) akan merujuk nama ini untuk penamaan fail
        namaSimpanan: "TEMPLATE SIJIL KPI",
        convertToSlides: true // Memberitahu backend untuk menukar format ke Google Slides
    });
}

// Sekarang senaraiDokumen hanya akan mengandungi 8 item untuk Admin/Penyelaras, 
// dan kekal 7 item untuk pengguna biasa.

        // 🌟 FUNGSI BARU: Ambil Tahun Semasa dari Tab SISTEM
        function ambilTahunSemasa() {
            fetch(`${SCRIPT_URL}?action=ambilTetapanSenarai`)
            .then(res => res.json())
            .then(data => {
                if(data.status === "BERJAYA" && data.TAHUN_SEMASA && data.TAHUN_SEMASA.length > 0) {
                    const tahunAktif = data.TAHUN_SEMASA[0]; // Ambil rekod pertama dalam senarai TAHUN SEMASA
                    const lencanaTahun = document.getElementById("paparanTahunSemasa");
                    if (lencanaTahun) {
                        lencanaTahun.innerText = "Tahun Semasa: " + tahunAktif;
                        lencanaTahun.classList.remove("hidden");
                    }
                }
            })
            .catch(err => console.log("Ralat mendapatkan tetapan tahun:", err));
        }

        // FUNGSI UI (REKA BENTUK 2 BAHAGIAN)
        function paparSenaraiDokumen() {
            const container = document.getElementById("senaraiDokumen");
            container.innerHTML = "";

            senaraiDokumen.forEach((doc, index) => {
                const hasFile = doc.failDitemui && doc.failDitemui.length > 0;
                const hasTemplateFile = doc.templatesDitemui && doc.templatesDitemui.length > 0;

                // BAHAGIAN 1: STATUS & BUTANG DOKUMEN UTAMA
                let statusHtmlUtama = "<span class='text-gray-500 italic'>⚠️ Belum dimuat naik</span>";
                if (hasFile) {
                    statusHtmlUtama = doc.failDitemui.map(f => `<span class="text-emerald-700">✅ <strong>${f.name}</strong></span>`).join('<br>');
                    if (doc.id === "doc5" && doc.tahun) {
                        statusHtmlUtama += `<br><span class="text-blue-600 font-semibold mt-1 inline-block">📌 (Tahun: ${doc.tahun})</span>`;
                    }
                }

                let butangAksiHtml = "";
                if (!hasFile) {
                    if (layakUpload) {
                        butangAksiHtml = `<button onclick="klikInputFail('${doc.id}', false)" class="w-full bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-lg text-sm font-bold transition shadow-sm">📤 Muat Naik Dokumen</button>`;
                    } else {
                        butangAksiHtml = `<span class="text-gray-400 italic text-sm">Tiada Akses Memuat Naik</span>`;
                    }
                } else {
                    let btnDownload = doc.failDitemui.map(f => {
                        const ext = f.name.split('.').pop().toUpperCase();
                        return `<button onclick="window.open('${f.url}', '_blank')" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-lg text-sm font-bold shadow-sm transition">📥 Muat Turun ${ext}</button>`;
                    }).join('');
                    
                    let btnTukar = layakUpload ? `<button onclick="klikInputFail('${doc.id}', false)" class="bg-amber-500 hover:bg-amber-600 text-white px-3 py-2 rounded-lg text-sm font-bold shadow-sm transition" title="Tukar Dokumen">🔄 Tukar</button>` : "";
                    
                    butangAksiHtml = `<div class="flex gap-2 w-full">${btnDownload}${btnTukar}</div>`;
                }

                // BAHAGIAN 2: STATUS & BUTANG TEMPLATE DOKUMEN
                let bahagianTemplateHtml = "";
                if (doc.hasTemplate) {
                    let statusHtmlTemplate = "<span class='text-gray-500 italic'>⚠️ Template belum disediakan</span>";
                    if (hasTemplateFile) {
                        statusHtmlTemplate = doc.templatesDitemui.map(t => `<span class="text-purple-700">✅ <strong>${t.name}</strong></span>`).join('<br>');
                    }

                    let butangTemplateHtml = "";
                    if (!hasTemplateFile) {
                        if (layakUpload) {
                            butangTemplateHtml = `<button onclick="klikInputFail('${doc.id}', true)" class="w-full bg-yellow-500 hover:bg-yellow-600 text-white px-4 py-2.5 rounded-lg text-sm font-bold transition shadow-sm">📤 Upload Template</button>`;
                        } else {
                            butangTemplateHtml = `<span class="text-gray-400 italic text-sm">Menunggu Admin Muat Naik</span>`;
                        }
                    } else {
                        let btnDownloadTpl = doc.templatesDitemui.map(t => {
                            const ext = t.name.split('.').pop().toUpperCase();
                            const btnColor = ext === 'PDF' ? 'bg-red-500 hover:bg-red-600' : (ext.includes('DOC') ? 'bg-blue-600 hover:bg-blue-700' : 'bg-purple-600 hover:bg-purple-700');
                            return `<button onclick="muatTurunFailAutomatik('${t.url}')" class="flex-1 ${btnColor} text-white px-3 py-2 rounded-lg text-sm font-bold shadow-sm transition">📄 Download ${ext}</button>`;
                        }).join('');
                        
                        let btnTukarTpl = layakUpload ? `<button onclick="klikInputFail('${doc.id}', true)" class="bg-amber-500 hover:bg-amber-600 text-white px-3 py-2 rounded-lg text-sm font-bold shadow-sm transition" title="Tukar Template">🔄 Tukar</button>` : "";
                        
                        butangTemplateHtml = `<div class="flex gap-2 w-full">${btnDownloadTpl}${btnTukarTpl}</div>`;
                    }

                    bahagianTemplateHtml = `
                        <div class="bg-purple-50 p-4 rounded-xl border border-purple-100 flex flex-col justify-between">
                            <div>
                                <p class="text-[11px] font-bold text-purple-600 mb-2 uppercase tracking-wider border-b border-purple-200 pb-1">📝 Template Dokumen</p>
                                <div class="text-sm mb-4">${statusHtmlTemplate}</div>
                            </div>
                            <div>
                                ${butangTemplateHtml}
                            </div>
                        </div>
                    `;
                }

                // GABUNGAN REKA BENTUK GRID (KAD UTAMA)
                const gridClass = doc.hasTemplate ? "grid grid-cols-1 md:grid-cols-2 gap-4 mt-4" : "mt-4";
                const bgKadUtama = hasFile ? 'bg-white border-gray-200' : 'bg-white border-gray-200';

                const htmlBaris = `
                    <div class="p-5 border-2 rounded-2xl shadow-sm ${bgKadUtama} transition duration-300 relative overflow-hidden">
                        <h3 class="font-bold text-gray-800 uppercase tracking-wide text-[15px] border-b border-gray-200 pb-3">${index + 1}. ${doc.tajuk}</h3>
                        
                        <div class="${gridClass}">
                            <div class="bg-blue-50 p-4 rounded-xl border border-blue-100 flex flex-col justify-between">
                                <div>
                                    <p class="text-[11px] font-bold text-blue-600 mb-2 uppercase tracking-wider border-b border-blue-200 pb-1">📄 Dokumen Lengkap (Selesai)</p>
                                    <div class="text-sm mb-4">${statusHtmlUtama}</div>
                                </div>
                                <div>
                                    ${butangAksiHtml}
                                </div>
                            </div>

                            ${bahagianTemplateHtml}
                        </div>

                        ${layakUpload ? `
                            <input type="file" id="input_file_${doc.id}" class="hidden" onchange="handlePilihFail(event, '${doc.id}', false)" accept=".pdf,.doc,.docx,.xls,.xlsx,.png,.jpg">
                            <input type="file" id="input_template_${doc.id}" class="hidden" onchange="handlePilihFail(event, '${doc.id}', true)" accept=".pdf,.doc,.docx,.xls,.xlsx">
                        ` : ''}
                    </div>
                `;
                container.innerHTML += htmlBaris;
            });
        }

        // FUNGSI DIRECT DOWNLOAD TEMPLATE 
        function muatTurunFailAutomatik(url) {
            const fileIdMatch = url.match(/[-\w]{25,}/);
            if (fileIdMatch && fileIdMatch[0]) {
                const directDownloadUrl = `https://drive.google.com/uc?export=download&id=${fileIdMatch[0]}`;
                paparNotis("📥 Memuat turun template secara automatik...", "biru");
                
                const link = document.createElement("a");
                link.href = directDownloadUrl;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } else {
                paparNotis("❌ Ralat: URL template tidak sah di dalam Google Drive.", "merah");
            }
        }

        function klikInputFail(id, isTemplate) {
            const inputId = isTemplate ? `input_template_${id}` : `input_file_${id}`;
            const input = document.getElementById(inputId);
            if(input) {
                input.value = ''; 
                input.click();
            }
        }

        function handlePilihFail(event, id, isTemplate) {
            const fail = event.target.files[0];
            if (!fail) return;

            if (id === "doc5") {
                failSementara = fail;
                idDokumenSementara = id;
                bukaModalTahun();
                return;
            }

            paparNotis(`⏳ Sedang memuat naik '${fail.name}' ke Google Drive...`, "biru");

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Data = e.target.result.split(',')[1]; 
                
                const docInfo = senaraiDokumen.find(d => d.id === id);
                const extension = fail.name.split('.').pop();
                
                let namaFailRasmi = "";
                if (isTemplate) {
                    const tajukTemplate = docInfo.templateKunci ? docInfo.templateKunci : docInfo.tajuk;
                    namaFailRasmi = `TEMPLATE ${tajukTemplate}.${extension}`;
                } else {
                    namaFailRasmi = `${docInfo.tajuk}.${extension}`;
                }

                const payloadJSON = {
                    action: "uploadDokumenBiasa",
                    folderId: FOLDER_ID_DOKUMEN,
                    fileName: namaFailRasmi,
                    mimeType: fail.type,
                    fileData: base64Data
                };

                fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payloadJSON)
                })
                .then(response => response.json())
                .then(data => {
                    if(data.status === 'success' || data.status === 'BERJAYA') {
                        paparNotis(`✅ Berjaya! Dokumen disimpan. Sedang menyegarkan paparan...`, "hijau");
                        semakStatusDariDrive(); 
                    } else {
                        paparNotis(`❌ Ralat Google Drive: ${data.message || data.mesej}`, "merah");
                    }
                })
                .catch(error => {
                    paparNotis(`❌ Ralat sistem: ${error.message}`, "merah");
                });
            };
            reader.readAsDataURL(fail);
        }

        function bukaModalTahun() {
            document.getElementById("inputTahun").value = new Date().getFullYear();
            const modal = document.getElementById("modalTahun");
            modal.classList.remove("hidden");
            modal.classList.add("flex");
        }

        function tutupModalTahun() {
            const modal = document.getElementById("modalTahun");
            modal.classList.remove("flex");
            modal.classList.add("hidden");
            failSementara = null;
            idDokumenSementara = null;
        }

       function sahkanMuatNaikKamus() {
            const tahun = document.getElementById("inputTahun").value;
            if (!tahun) {
                alert("Sila masukkan tahun yang sah.");
                return;
            }

            const modal = document.getElementById("modalTahun");
            modal.classList.remove("flex");
            modal.classList.add("hidden");

            paparNotis(`⏳ Sedang memuat naik ke Google Drive (Tahun ${tahun}). Sila tunggu...`, "biru");

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Data = e.target.result.split(',')[1]; 
                
                const extension = failSementara.name.split('.').pop();
                const namaFailRasmi = `KAMUS KPI_${tahun}.${extension}`;

                const payloadJSON = {
                    action: "uploadKamusKPI",
                    folderId: FOLDER_ID_KAMUS,
                    tahun: tahun,
                    fileName: namaFailRasmi,
                    mimeType: failSementara.type,
                    fileData: base64Data
                };

                fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payloadJSON)
                })
                .then(response => response.json())
                .then(data => {
                    if(data.status === 'success' || data.status === 'BERJAYA') {
                        paparNotis(`✅ Berjaya! Fail untuk tahun ${tahun} selamat disimpan di Drive.`, "hijau");
                        
                        // 🌟 PENYELESAIAN: Kemaskini UI Secara Optimistik
                        // Kita masukkan terus maklumat fail ke dalam pembolehubah tanpa tunggu semakan dari Drive
                        const docIndex = senaraiDokumen.findIndex(d => d.id === "doc5");
                        if (docIndex !== -1) {
                            senaraiDokumen[docIndex].failDitemui = [{
                                name: namaFailRasmi,
                                url: data.url || data.fileUrl || "#" // Pakai URL dari GAS jika ada, atau '#' sementara
                            }];
                            senaraiDokumen[docIndex].tahun = tahun;
                        }
                        
                        paparSenaraiDokumen(); // Paksa paparan web dikemaskini serta-merta!

                        failSementara = null;
                        idDokumenSementara = null;
                        
                        // Berikan masa (delay 3 saat) sebelum buat semakan penuh untuk elak isu 'Drive belum index'
                        setTimeout(() => {
                            semakStatusDariDrive();
                        }, 3000);
                        
                    } else {
                        paparNotis(`❌ Ralat Google Drive: ${data.message || data.mesej}`, "merah");
                    }
                })
                .catch(error => {
                    paparNotis(`❌ Ralat sistem: ${error.message}`, "merah");
                });
            };

            reader.readAsDataURL(failSementara);
        }

        function semakStatusDariDrive() {
            paparNotis("🔄 Menyemak rekod dokumen di Google Drive...", "biru");

            const payloadJSON = {
                action: "semakDokumen",
                folderIdDokumen: FOLDER_ID_DOKUMEN,
                folderIdKamus: FOLDER_ID_KAMUS
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payloadJSON)
            })
            .then(response => response.json())
            .then(result => {
                if (result.status === 'success') {
                    const failDariDrive = result.data; 

                    senaraiDokumen.forEach(doc => {
                        // 1. CARI FAIL RASMI UTAMA
                        const failDitemui = Object.keys(failDariDrive).filter(namaFail => 
                            namaFail.startsWith(doc.tajuk) && !namaFail.toUpperCase().includes("TEMPLATE")
                        );
                        
                        if (failDitemui.length > 0) {
                            doc.failDitemui = failDitemui.map(namaFail => ({
                                name: namaFail,
                                url: failDariDrive[namaFail].url
                            }));
                            
                            if (doc.id === "doc5") {
                                const matchTahun = failDitemui[0].match(/\d{4}/);
                                if (matchTahun) doc.tahun = matchTahun[0];
                            }
                        } else {
                            doc.failDitemui = []; // Reset jika dipadam
                        }

                        // 2. CARI FAIL TEMPLATE
                        if (doc.hasTemplate) {
                            const kataKunciCarian = doc.templateKunci ? doc.templateKunci.toUpperCase() : doc.tajuk.toUpperCase();
                            
                            const templateJumpa = Object.keys(failDariDrive).filter(namaFail => 
                                namaFail.toUpperCase().includes("TEMPLATE") && 
                                namaFail.toUpperCase().includes(kataKunciCarian)
                            );

                            if (templateJumpa.length > 0) {
                                doc.templatesDitemui = templateJumpa.map(namaFail => ({
                                    name: namaFail,
                                    url: failDariDrive[namaFail].url
                                }));
                            } else {
                                doc.templatesDitemui = []; // Reset jika dipadam
                            }
                        }
                    });

                    paparSenaraiDokumen(); 
                    paparNotis("✅ Sinkronisasi Google Drive berjaya.", "hijau");
                }
            })
            .catch(error => {
                paparNotis("❌ Gagal menyemak status Drive.", "merah");
            });
        }

        function paparNotis(teks, warna) {
            const msgBox = document.getElementById('mesejUI');
            const colorClass = (warna === 'hijau') ? 'bg-green-100 text-green-800 border-green-200' : 
                               (warna === 'merah') ? 'bg-red-100 text-red-800 border-red-200' : 
                               'bg-blue-100 text-blue-800 border-blue-200';
            
            msgBox.className = `mb-6 p-4 rounded-xl text-center text-sm font-bold shadow-sm border ${colorClass}`;
            msgBox.innerHTML = teks; 
            msgBox.classList.remove('hidden');
            
            setTimeout(() => msgBox.classList.add('hidden'), 4000);
        }

        // 🌟 KEMASKINI: Panggil ambilTahunSemasa() semasa halaman dimuatkan
        window.onload = () => {
            ambilTahunSemasa(); 
            paparSenaraiDokumen(); 
            semakStatusDariDrive(); 
        };
    </script>
</body>
</html>
